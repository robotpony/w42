baseURL = 'https://warpedvisions.org/'
locale = 'en-us'
title = 'warpedvisions.org'
theme = 'w42'

# Drafts never reach public/: preview passes -D, production builds skip them,
# and tools/publish.sh check fails if one slips through.
buildDrafts = false

[pagination]
pagerSize = 5

[params]
mainSections = ['blog']
description = '[ESSAYS](/), [RECIPES](https://bruce-loves-to-cook.ca/), AND [GENERAL MAKERY](/projects) BY [BRUCE ALDERSON](/pages/about-bruce-alderson).'
footer.text = "[@robotpony mas.to](https://mas.to/@robotpony)"
disableSpecial1stPost = true
defaultTheme = "light"
# Used for RSS and meta author.
author = "Bruce Alderson"
# Default share image (og:image, twitter:card) for pages without their own.
images = ["images/og-default.png"]

warpedScript = "https://cdn.warpedvisions.org/warped.js"
warpedStyle = "https://cdn.warpedvisions.org/warped.css"

# newContentEditor = "ia"

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false

[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^git$', '^vim$']

[services]
[services.googleAnalytics]
id = "G-77V9MKYGJ8"

[params.assets]
disableScrollBarStyle = true

[markup]
[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
hl_Lines = ''
hl_inline = false
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = false
noHl = false
style = 'monokai'
tabWidth = 4

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

